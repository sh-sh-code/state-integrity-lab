[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "state-integrity-lab"
version = "0.1.0"
description = "Defensive QA / audit tool for verifying state-transition integrity in AI/SaaS services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "State Integrity Lab Authors" }]
keywords = ["qa", "audit", "bug-bounty", "state-integrity", "saas"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "SQLAlchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.43.0", "pytest-playwright>=0.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[project.scripts]
sil = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "reports*", "artifacts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter / max-line-length is advisory.

[tool.ruff.lint.per-file-ignores]
# Typer's API requires `typer.Option(...)` calls as default values.
"app/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/", "reports/", "artifacts/"]
